name: Build Muhil Music APK

on:
  push:
    branches: [ "abc", "main" ]
  pull_request:
    branches: [ "abc", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-muhil-music:
    name: Build Muhil Music Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Accept Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify google-services.json present
        run: |
          if [ -f "muhilmusic/google-services.json" ]; then
            echo "google-services.json found - Firebase build enabled."
          else
            echo "ERROR: muhilmusic/google-services.json is missing!"
            exit 1
          fi

      - name: Ensure Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -validity 10000
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Muhil Music Debug APK
        run: ./gradlew :muhilmusic:assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Verify Muhil Music APK Generated
        id: verify_apk
        run: |
          APK_FILE=$(find muhilmusic/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found under muhilmusic/build/outputs/apk/"
            exit 1
          fi
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Generated APK is empty!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          ls -lh "$APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Muhil Music APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Muhil-Music-debug-APK
          path: ${{ steps.verify_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Upload Build Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: muhilmusic-build-diagnostics
          path: |
            muhilmusic/build/reports/
            build/reports/
          retention-days: 14
          if-no-files-found: ignore
